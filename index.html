<style>

canvas{display:block;width:100%;height:100%}

#jk{position:absolute;left:28px;top:28px;width:44px;height:44px;border-radius:50%;background:#fffa}

<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),W=1600,H=1000,R=Math.random,rr=(a,b)=>a+R()*(b-a),pick=a=>a[R()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v));

let lang=ls('lang')||'bn',mute=ls('mute')=='1',best=+ls('best')||0;const t_=a=>a[lang=='bn'?1:0];
const L={play:['PLAY ▶','খেলো ▶'],tag:['Slap the slackers. Save your CGPA.','পড়ালেখা ফেলে আড্ডা? এক চড়েই ঠান্ডা!'],
how:['Slap students who wander, scroll Reels, sip cha or sneak off to tuition. <b>Never</b> slap real studiers 📖, teachers 🌂, Architecture students 📐 or cats 🐈, and never near the Mosque, Medical Centre or Shahid Minar. If students escape through the gates your CGPA drops. Below 2.00 = TERM DROP!','যারা পড়া ফেলে ঘুরছে, রিল দেখছে, চা খাচ্ছে বা টিউশনে পালাচ্ছে তাদের চড় দাও। <b>কখনোই</b> সত্যিকারের পড়ুয়া 📖, স্যার 🌂, আর্কিটেকচারের ছাত্র 📐 বা বিড়াল 🐈 কে নয়; মসজিদ, মেডিকেল সেন্টার ও শহীদ মিনারের কাছেও নয়। গেট দিয়ে পালালে CGPA কমবে। ২.০০ এর নিচে = টার্ম ড্রপ!'],
ctl:['WASD move · Mouse / Space slap · Shift dash · E whistle · P pause · Phone: joystick + buttons','WASD চলা · মাউস / স্পেস চড় · Shift ড্যাশ · E হুইসেল · P বিরতি · ফোনে: জয়স্টিক + বাটন'],
sc:['Score','স্কোর'],lv:['Lvl','লেভেল'],ad:['Adda','আড্ডা'],slap:['SLAP','ঠাস!'],dash:['DASH','ড্যাশ'],whi:['WHISTLE','হুইসেল'],
over:['TERM DROP!','টার্ম ড্রপ!'],overS:['Back-paper dite hobe.','ব্যাক-পেপার দিতে হবে।'],clr:['Class cleared!','ক্লাস শেষ!'],nxt:['Next level ▶','পরের লেভেল ▶'],
again:['Play again','আবার খেলো'],share:['Share','শেয়ার'],res:['Resume','চালিয়ে যাও'],paused:['Paused','বিরতি'],
resp:['Eikhane na, bhai 🙏','এখানে না, ভাই 🙏'],wh:['Whistle! Everyone freeze!','হুইসেল! সবাই স্থির!'],lsd:['Load-shedding! 💡','লোড-শেডিং! 💡'],
boss:['BOSS: Kal Theke Pora Shuru Man','বস: কাল-থেকে-পড়ব ভাই'],credit:['Inspired by BD Tesla Slapper. Fictional parody, no real person is depicted.','অনুপ্রেরণা: BD Tesla Slapper। কাল্পনিক প্যারোডি, কোনো বাস্তব ব্যক্তি নয়।']};
const RK=[[0,'Fresher','ফ্রেশার'],[150,'Tong Hunter','টং হান্টার'],[400,'Library Guardian','লাইব্রেরি গার্ডিয়ান'],[800,'Hall Sheriff','হল শেরিফ'],[1500,'Term-Final Terror','টার্ম-ফাইনাল টেরর'],[3000,'Proctor Supreme','প্রক্টর সুপ্রিম']];
const rk=()=>{let r=RK[0];for(const x of RK)if(score>=x[0])r=x;return lang=='bn'?r[2]:r[1]};
const SL={ok:[['Bhai, ami library jaitesilam!','ভাই, আমি লাইব্রেরি যাইতেছিলাম!'],['Kal theke pora shuru, pakka!','কাল থেকে পড়ব, পাক্কা!'],['Ekta cha kheye pori.','একটা চা খেয়ে পড়ি।'],['CT te 20/20 pabo, tension nai.','CT তে ২০/২০ পাব, টেনশন নাই।'],['Tuition e late hoye gelo!','টিউশনে লেট হয়ে গেল!'],['Sir ke bolbo kintu!','স্যারকে বলব কিন্তু!'],['Hall e match cholche, 5 min!','হলে খেলা চলছে, ৫ মিনিট!']],
bad:[['Studying here, bhai!','পড়ছি ভাই, পড়ছি!'],['Slap me and see…','মেরে দেখো…'],['ID card dekhao.','আইডি কার্ড দেখাও।']],cat:[['Meow 🐱','মিঁউ 🐱']]};
// ---- audio (synth only)
let ac,step=0;const A=()=>{if(!ac)try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}};
function tone(f,d,ty='square',v=.1,f2){if(mute||!ac)return;const o=ac.createOscillator(),n=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n).connect(ac.destination);o.start();o.stop(t+d)}
function noise(d,v=.2){if(mute||!ac)return;const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(R()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),n=ac.createGain();s.buffer=b;n.gain.value=v;s.connect(n).connect(ac.destination);s.start()}
setInterval(()=>{if(state!='play'||mute||!ac)return;step=(step+1)%8;if(step%2==0)tone(70,.12,'sine',.16,40);else noise(.03,.04);if(step%4==0||step==6)tone([110,0,147,0,110,0,165,147][step]||110,.2,'triangle',.07)},230);
// ---- map data
const B=[['Library',330,120,150,90,'#b5452e'],['Auditorium',520,150,120,80,'#c9752f'],['Old Academic',700,70,200,80,'#a8553a'],['EME Building',720,190,170,100,'#e8891c'],['Civil Eng.',950,260,140,90,'#9c4a3a'],['Medical Centre',1130,130,110,80,'#d94f6a',1],['Shahid Minar',1400,140,60,60,'#cfcfcf',1],['Suhrawardy Hall',250,420,120,80,'#8b5e3c'],['Sher-e-Bangla Hall',420,520,130,80,'#8b5e3c'],['Gymnasium',550,700,100,70,'#6b7a8f'],['Central Mosque',700,700,100,80,'#2e9e8a',1],['Ahsanullah Hall',880,640,130,80,'#8b5e3c'],['Cafeteria',1050,720,70,70,'#f3c623'],['Dhakeswari B-blocks',150,720,190,60,'#7a6a5a'],['Dhakeswari B-blocks',150,830,190,60,'#7a6a5a']];
const G=[[60,150,'05'],[60,330,'02'],[60,560,'01'],[1540,380,'04'],[1540,880,'03']];
const P=[[300,300],[600,330],[640,420],[1000,420],[900,560],[700,600],[1000,560],[480,640],[400,800],[950,850],[1250,620],[1300,250],[600,250],[200,450],[300,805],[1200,830],[800,380],[560,440]];
const SIT=[[1040,830],[1090,835],[1140,825]],Z=['Polashi Mor','Academic Axis','Asian Highway','Hall Row','Playground & Cafeteria','Dhakeswari Quarters','Admission Rush'];
const MAP=(()=>{const m=document.createElement('canvas');m.width=W;m.height=H;const c=m.getContext('2d');
c.fillStyle='#7fb069';c.fillRect(0,0,W,H);c.fillStyle='#8fcf74';c.fillRect(1150,330,300,200);c.strokeStyle='#fffa';c.lineWidth=3;c.strokeRect(1160,340,280,180);c.beginPath();c.moveTo(1300,340);c.lineTo(1300,520);c.stroke();
c.fillStyle='#d8c9a3';c.fillRect(660,0,40,H);c.fillRect(1480,0,40,H);
c.lineCap='butt';c.strokeStyle='#4a4f57';c.lineWidth=90;c.beginPath();c.moveTo(-50,117);c.lineTo(1650,882);c.stroke();
c.strokeStyle='#f6ebd3';c.lineWidth=3;c.setLineDash([30,24]);c.beginPath();c.moveTo(0,140);c.lineTo(1600,860);c.stroke();c.setLineDash([]);
for(let i=0;i<70;i++){const x=R()*W,y=R()*H;if(Math.abs(.45*x-y+140)/1.0966<75||Math.abs(x-680)<35||Math.abs(x-1500)<35||(x>1130&&x<1470&&y>310&&y<550)||B.some(b=>x>b[1]-30&&x<b[1]+b[3]+30&&y>b[2]-30&&y<b[2]+b[4]+30))continue;c.fillStyle='#0003';c.beginPath();c.arc(x+4,y+4,16,0,7);c.fill();c.fillStyle='#2f7d4f';c.beginPath();c.arc(x,y,16,0,7);c.fill();c.fillStyle='#3d9a62';c.beginPath();c.arc(x-4,y-4,8,0,7);c.fill()}
c.textAlign='center';c.fillStyle='#fff';c.font='bold 14px Hind Siliguri,sans-serif';
c.save();c.translate(800,500);c.rotate(Math.atan2(720,1600));c.fillText('Zahir Raihan Rd (Asian Highway)',0,5);c.restore();
c.save();c.translate(680,900);c.rotate(-Math.PI/2);c.fillStyle='#4a3a20';c.fillText('BUET Central Road',0,5);c.restore();
c.save();c.translate(1500,640);c.rotate(-Math.PI/2);c.fillStyle='#4a3a20';c.fillText('Shahid Minar Rd',0,5);c.restore();
c.fillStyle='#fff';c.fillText('BUET Central Playground',1300,440);
for(const b of B){const[n,x,y,w,h,col,rs]=b;if(rs){c.strokeStyle='#fffc';c.lineWidth=2;c.setLineDash([8,6]);c.strokeRect(x-45,y-45,w+90,h+90);c.setLineDash([])}
c.fillStyle='#0004';c.fillRect(x+9,y+9,w,h);if(n[0]=='E'){c.shadowColor='#ffb347';c.shadowBlur=28}c.fillStyle=col;c.fillRect(x,y,w,h);c.shadowBlur=0;c.fillStyle='#fff3';c.fillRect(x,y,w,8);c.strokeStyle='#1b1b1f';c.lineWidth=2;c.strokeRect(x,y,w,h);
c.fillStyle=n=='Cafeteria'||n=='Shahid Minar'?'#1b1b1f':'#fff';c.font='bold 11px Hind Siliguri,sans-serif';c.fillText(n,x+w/2,y+h/2+4);if(rs)c.fillText('🙏',x+w/2,y-8)}
for(const q of G){c.fillStyle='#f3c623';c.strokeStyle='#1b1b1f';c.lineWidth=3;c.beginPath();c.arc(q[0],q[1],26,0,7);c.fill();c.stroke();c.fillStyle='#1b1b1f';c.font='bold 12px sans-serif';c.fillText('Gate',q[0],q[1]-2);c.fillText(q[2],q[0],q[1]+12)}
return m})();
// ---- state
let state='menu',cur,p,ts=[],pk=[],pops=[],stars=[],cg=4,score=0,lv=1,kills=0,quota=0,tm=0,streak=0,adda=0,wrong=0,spT=0,pkT=8,lsT=0,lsDone=0,bossDown=0,stop=0,shk=0,hurt=0,jx=0,jy=0,jid=-1,jo=[0,0],mx=0,my=0,mouseOn=0,vw=0,vh=0,dpr=1,z=1,last=0,idc=0;const k={},cam={x:0,y:0};
const T={wander:{pts:10,spd:48,col:'#e4572e',prop:'🚶'},reel:{pts:10,spd:60,col:'#7e57c2',prop:'📱'},tuition:{pts:20,spd:115,col:'#f3a712',prop:'🎒',run:1},sit:{pts:10,spd:0,col:'#29b6a7',prop:'☕'},gym:{pts:40,spd:42,col:'#c0392b',prop:'💪',hp:2},boss:{pts:100,spd:70,col:'#3b2f63',prop:'🧙',hp:3,boss:1},
study:{bad:.25,spd:50,col:'#3a7bd5',prop:'📖'},teacher:{bad:.5,spd:38,col:'#5d4037',prop:'🌂'},arch:{bad:.25,spd:55,col:'#455a64',prop:'📐'},cat:{bad:.25,spd:70,cat:1}};
const V=[{s:100,v:170,e:'🚌',c:'#e63946'},{s:900,v:-150,e:'🛺',c:'#2e9e5b'},{s:1300,v:210,e:'🚕',c:'#f3c623'},{s:500,v:-190,e:'🚌',c:'#1d7fd1'}];
const vpos=v=>{const o=v.v>0?-16:16;return[v.s*.912-.41*o,140+v.s*.41+.912*o]};
const tt=a=>{const e=$('toast');e.textContent=t_(a);e.style.opacity=1;clearTimeout(tt.h);tt.h=setTimeout(()=>e.style.opacity=0,1600)};
const pop=(x,y,s,c='#fff',sz=16)=>pops.push({x,y,s,c,sz,l:1});
function mkP(){return{x:600,y:300,r:14,face:0,mv:0,cd:0,inv:0,sp:0,dbl:0,big:0,dsh:0,dcd:0,wcd:0,fz:0,ct:0,sw:0}}
function spawn(ty,x,y){const t=Object.assign({ty,x,y,r:13,hp:1,gx:x,gy:y,w:0,sl:0,st2:rr(0,3),ph:R()*6,dead:0,mv:0,sk:0,rot:0,id:++idc,tp:2.4,hurt:0},T[ty]);t.spd*=1+lv*.04;if(t.run)t.gt=pick(G);ts.push(t);return t}
function spawnRand(){const w=[['wander',3],['reel',2],['tuition',2],['pair',1.2],['gym',lv>1?1:0],['study',2],['teacher',.7],['arch',1],['cat',.7]];let s=R()*w.reduce((a,b)=>a+b[1],0),ty='wander';for(const x of w){if((s-=x[1])<0){ty=x[0];break}}
const q=pick(G);if(ty=='cat'){const c=pick(P);spawn('cat',c[0],c[1])}else if(ty=='pair'){const a=spawn('wander',q[0],q[1]),b=spawn('wander',q[0]+28,q[1]+6);a.mate=b;b.mate=a;b.follow=a;ng(a)}else{const t=spawn(ty,q[0],q[1]);ng(t)}}
function ng(t){if(t.run){t.gx=t.gt[0];t.gy=t.gt[1];return}if(t.ty=='study'&&R()<.6){t.gx=420+rr(-60,60);t.gy=240;return}const q=pick(P);t.gx=q[0]+rr(-20,20);t.gy=q[1]+rr(-20,20)}
function startLevel(){ts=[];pk=[];pops=[];kills=0;quota=8+2*lv;tm=80;adda=0;wrong=0;lsT=0;lsDone=0;bossDown=0;streak=0;p.x=600;p.y=300;
SIT.forEach(s=>spawn('sit',s[0],s[1]));if(lv%3==0){const b=spawn('boss',800,380);ng(b);tt(L.boss)}else tt(['Level '+lv+' · '+Z[(lv-1)%7],'লেভেল '+lv+' · '+Z[(lv-1)%7]]);for(let i=0;i<4;i++)spawnRand()}
function start(){A();cg=4;score=0;lv=1;p=mkP();startLevel();state='play';$('ov').style.display='none'}
function nx(){lv++;startLevel();state='play';$('ov').style.display='none'}
function ov(f){cur=f;const o=$('ov');o.innerHTML='<div class="pn">'+f()+'<small>'+t_(L.credit)+'</small></div>';o.style.display='flex'}
function menu(){state='menu';ov(()=>`<h1>🩴 BUET Slapper</h1><h2>পড়তে যা!</h2><p class="tg">${t_(L.tag)}</p><p>${t_(L.how)}</p><p class="ct">${t_(L.ctl)}</p><button class="pb" onclick="start()">${t_(L.play)}</button><button class="pb s" onclick="lg()">🌐 ${lang=='bn'?'English':'বাংলা'}</button><p>🏆 ${best}</p>`)}
function end(w){best=Math.max(best,score);if(w){state='clear';const st=wrong==0?3:cg>=3.5?2:1,b=Math.ceil(tm)*5;score+=b;best=Math.max(best,score);ls('best',best);ov(()=>`<h1>✅ ${t_(L.clr)}</h1><p>${'⭐'.repeat(st)+'☆'.repeat(3-st)}</p><p>${t_(L.sc)}: ${score} (+${b})</p><p>CGPA ${cg.toFixed(2)}</p><button class="pb" onclick="nx()">${t_(L.nxt)}</button>`)}
else{state='over';ls('best',best);tone(200,.7,'sawtooth',.15,60);ov(()=>`<h1>💀 ${t_(L.over)}</h1><p>${t_(L.overS)}</p><p>${t_(L.sc)}: ${score} · 🏆 ${best}</p><p>🎖 ${rk()}</p><button class="pb" onclick="start()">${t_(L.again)}</button><button class="pb s" onclick="sh()">${t_(L.share)}</button>`)}}
function sh(){const s=`BUET Slapper: ${score} pts · ${rk()} · CGPA ${cg.toFixed(2)} 🩴 ${location.href}`;if(navigator.share)navigator.share({text:s}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>tt(['Copied!','কপি হয়েছে!']))}
function pause(){if(state=='play'){state='pause';ov(()=>`<h1>⏸ ${t_(L.paused)}</h1><button class="pb" onclick="resume()">${t_(L.res)}</button><button class="pb s" onclick="lg()">🌐</button>`)}else if(state=='pause')resume()}
function resume(){state='play';$('ov').style.display='none'}

function man(x,y,col,prop,ph,mv,sc){const b=mv?Math.sin(ph)*2:0;g.save();g.translate(x,y);g.scale(sc||1,sc||1);g.fillStyle='#0003';g.beginPath();g.ellipse(0,14,11,5,0,0,7);g.fill();

if(p){const D=ts.map(t=>[t.y,()=>drawT(t)]);D.push([p.y,drawP]);pk.forEach(o=>D.push([o.y,()=>{o.ph+=.05;g.font='24px serif';g.textAlign='center';g.fillText(o.e,o.x,o.y+Math.sin(o.ph)*4)}]));D.sort((a,b)=>a[0]-b[0]).forEach(d=>d[1]())}
g.textAlign='center';for(const o of stars){g.fillStyle='#ffd23f';g.font='16px sans-serif';g.fillText('✦',o.x,o.y)}
for(const o of pops){g.globalAlpha=Math.min(1,o.l*1.5);g.font=`bold ${o.sz}px Hind Siliguri,sans-serif`;g.lineWidth=4;g.strokeStyle='#111';g.strokeText(o.s,o.x,o.y);g.fillStyle=o.c;g.fillText(o.s,o.x,o.y);g.globalAlpha=1}

if(p){$('hcg').textContent='🎓 CGPA '+cg.toFixed(2);$('hcg').style.color=cg<2.75?'#ff6b6b':'';$('hsc').textContent=t_(L.sc)+' '+score;$('hlv').textContent=t_(L.lv)+' '+lv;$('htm').textContent='⏱ '+Math.max(0,Math.ceil(tm))+' · '+(lv%3==0?'👹 BOSS':'🎯 '+kills+'/'+quota);$('had').textContent=t_(L.ad)+' '+Math.min(99,adda|0)+'%';
